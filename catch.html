<style>
  :root {
    --paper: #EEF0EB;
    --card: #FFFFFF;
    --ink: #1E2A38;
    --ink-soft: #5B6672;
    --accent: #E2A23B;
    --accent-ink: #1E2A38;
    --line: #DDE1D9;
    --danger: #C4573F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171B20;
      --card: #20262D;
      --ink: #ECEFF2;
      --ink-soft: #96A0AA;
      --line: #2C333B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171B20;
    --card: #20262D;
    --ink: #ECEFF2;
    --ink-soft: #96A0AA;
    --line: #2C333B;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 560px; padding: 28px 20px 60px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2.1rem;
    margin: 4px 0 2px;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 22px; line-height: 1.5; max-width: 46ch; }

  .capture {
    display: flex;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    position: sticky;
    top: 12px;
    z-index: 5;
  }
  .capture input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 1.02rem;
    color: var(--ink);
    padding: 10px 8px;
  }
  .capture input::placeholder { color: var(--ink-soft); }
  .capture button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 7px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0 18px;
    cursor: pointer;
  }
  .capture button:active { transform: scale(0.97); }

  .tabs { display: flex; gap: 18px; margin: 28px 0 6px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 0.92rem; font-weight: 600;
    color: var(--ink-soft); padding: 8px 2px 10px; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 2px; border-bottom: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
  .dot.fresh { background: var(--accent); }
  .dot.aging { background: var(--ink-soft); opacity: 0.6; }
  .dot.old { background: var(--danger); }

  .item-main { flex: 1; min-width: 0; }
  .item-text { font-size: 1rem; line-height: 1.4; word-wrap: break-word; }
  .item-text.done { text-decoration: line-through; color: var(--ink-soft); }
  .item-time { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }

  .check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--card);
    cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--card);
  }
  .check.done { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .clear { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 1.1rem; padding: 4px; flex-shrink: 0; }

  .empty { color: var(--ink-soft); font-size: 0.95rem; padding: 30px 2px; line-height: 1.6; }

  .mascot {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 20px;
    font-size: 2.1rem; transition: transform 0.25s ease; user-select: none; z-index: 4;
  }
  .mascot.bump { transform: scale(1.3) rotate(-8deg); }

  .sync-note { font-size: 0.75rem; color: var(--ink-soft); margin-top: 6px; }

  li.new-item { animation: drop-in 0.35s ease; }
  @keyframes drop-in {
    0% { opacity: 0; transform: translateY(-10px) rotate(-3deg); }
    60% { opacity: 1; transform: translateY(2px) rotate(1deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
  .confetti-piece {
    position: absolute; top: -10px; width: 8px; height: 14px; opacity: 0.9;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  .zero-banner {
    background: var(--accent); color: var(--accent-ink);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    border-radius: 10px; padding: 14px 16px; margin-top: 8px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Catch</h1>
  <div class="sub">The second you remember something — even mid-class — type it here. Don't decide anything now. Just catch it.</div>

  <div class="capture">
    <input id="input" type="text" placeholder="upload attendance record…" autocomplete="off">
    <button id="add">Catch it</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="pending">Pending</button>
    <button class="tab" data-tab="done">Done</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none;"></div>
  <div class="sync-note" id="syncNote"></div>
</div>

<div class="mascot" id="mascot">😌</div>
<div id="confetti"></div>

<script>
  const KEY = 'catch_items_v1';
  let items = [];
  let tab = 'pending';
  let lastAddedId = null;
  let prevPendingCount = null;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
    } catch (e) { items = []; }
  }
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  function save() {
    saveLocal();
  }

  function initStorage() {
    loadLocal();
    render();
    document.getElementById('syncNote').textContent = 'Saved on this device.';
  }

  function timeAgo(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'just now';
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    const d = Math.floor(hr / 24);
    return d + 'd ago';
  }
  function freshness(ts) {
    const hr = (Date.now() - ts) / 3600000;
    if (hr < 6) return 'fresh';
    if (hr < 24) return 'aging';
    return 'old';
  }

  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const filtered = items
      .filter(i => tab === 'pending' ? !i.done : i.done)
      .sort((a, b) => b.ts - a.ts);

    list.innerHTML = '';
    if (filtered.length === 0) {
      empty.style.display = 'block';
      empty.textContent = tab === 'pending'
        ? 'Nothing caught yet. Whatever crosses your mind next — drop it above.'
        : 'Nothing marked done yet. Clear a few from Pending when you get to them.';
      return;
    }
    empty.style.display = 'none';

    filtered.forEach(item => {
      const li = document.createElement('li');
      if (item.id === lastAddedId) { li.className = 'new-item'; lastAddedId = null; }

      const check = document.createElement('button');
      check.className = 'check' + (item.done ? ' done' : '');
      check.textContent = item.done ? '✓' : '';
      check.onclick = () => { item.done = !item.done; if (item.done) bumpMascot(); save(); render(); };

      const main = document.createElement('div');
      main.className = 'item-main';
      const text = document.createElement('div');
      text.className = 'item-text' + (item.done ? ' done' : '');
      text.textContent = item.text;
      const time = document.createElement('div');
      time.className = 'item-time';
      time.textContent = timeAgo(item.ts);
      main.appendChild(text);
      main.appendChild(time);

      const del = document.createElement('button');
      del.className = 'clear';
      del.textContent = '×';
      del.title = 'Remove';
      del.onclick = () => { items = items.filter(i => i.id !== item.id); save(); render(); };

      if (tab === 'pending') {
        const dot = document.createElement('div');
        dot.className = 'dot ' + freshness(item.ts);
        li.appendChild(dot);
      }
      li.appendChild(check);
      li.appendChild(main);
      li.appendChild(del);
      list.appendChild(li);
    });

    updateMascot();
  }

  function updateMascot() {
    const pending = items.filter(i => !i.done).length;
    const mascot = document.getElementById('mascot');
    mascot.textContent = pending === 0 ? '😌' : pending <= 3 ? '🙂' : pending <= 6 ? '😅' : '🫨';

    if (prevPendingCount !== null && prevPendingCount > 0 && pending === 0) {
      celebrate();
    }
    prevPendingCount = pending;
  }

  function bumpMascot() {
    const mascot = document.getElementById('mascot');
    mascot.classList.add('bump');
    setTimeout(() => mascot.classList.remove('bump'), 250);
  }

  function celebrate() {
    const colors = ['#E2A23B', '#1E2A38', '#C4573F', '#6E8C6A'];
    const holder = document.getElementById('confetti');
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      holder.appendChild(piece);
      setTimeout(() => piece.remove(), 3500);
    }
  }

  function addItem() {
    const input = document.getElementById('input');
    const val = input.value.trim();
    if (!val) return;
    const id = Date.now() + '-' + Math.random();
    items.push({ id, text: val, ts: Date.now(), done: false });
    lastAddedId = id;
    save();
    input.value = '';
    input.focus();
    bumpMascot();
    render();
  }

  document.getElementById('add').onclick = addItem;
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });
  document.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tab = btn.dataset.tab;
      render();
    };
  });

  initStorage();
  setInterval(render, 60000);

  // Register the real same-origin service worker for offline/PWA support.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
